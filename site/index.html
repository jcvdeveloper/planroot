<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Planroot — Iniciador de Projeto</title>
  <link rel="icon" href="/assets/img/planroot-mark.png?v=1f4d7a63" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  <!-- ?v= e cache busting: o host nao manda Cache-Control nos estaticos, entao
       o navegador decide sozinho por quanto tempo guarda CADA arquivo, e o
       visitante acaba com uma mistura de versoes.

       NAO edite estes hashes a mao: sao o sha256 do conteudo de cada arquivo,
       carimbados por tools/bump_assets_version.py e disparados pelo hook
       pre-commit sempre que um commit toca site/. Se o hook nao estiver
       instalado neste clone, rode: python3 tools/install_hooks.py -->
  <link rel="stylesheet" href="/assets/css/planroot.css?v=86cb2be1" />
</head>
<body>
  <!-- Fundo vivo: Lightfall (WebGL) + grid de blueprint por cima -->
  <div id="lightfall-bg" aria-hidden="true"></div>
  <div class="bg-grid"></div>
  <div class="bg-dots"></div>

  <!-- Header fixo: marca + medidor de clareza -->
  <header class="app-header">
    <a class="brand" href="/">
      <img class="brand-mark" src="/assets/img/planroot-mark.png?v=1f4d7a63" alt="" />
      <img class="brand-word" src="/assets/img/planroot-wordmark.png?v=b37fe9fa" alt="Planroot" />
    </a>
    <div class="progress-wrap" id="progressWrap" hidden>
      <div class="progress-meta">
        <span id="progressLabel">—</span>
        <span><span data-copy="ambiguity_label"></span> <b id="ambiguityValue">0%</b></span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </header>

  <!-- Stage central: troca de views, sem scroll -->
  <main class="stage">

    <!-- HERO -->
    <section class="view active hero" id="view-hero">
      <div class="mark-stage">
        <span class="mark-halo"></span>
        <span class="mark-ring"></span>
        <img class="mark-img" src="/assets/img/planroot-mark.png?v=1f4d7a63" alt="" />
      </div>
      <div class="hero-eyebrow"><span class="dot-live"></span>Motor determinístico PIF · entrevista adaptativa</div>
      <h1 class="grad-text" data-copy="hero_headline"></h1>
      <p class="sub" data-copy="hero_subhead"></p>
      <div class="brief-box">
        <textarea id="briefInput" data-copy-attr="placeholder:brief_placeholder"></textarea>
        <div class="brief-hint">
          <span data-copy="brief_hint"></span>
        </div>
      </div>
      <!-- Chips de exemplo: preenchem o brief. O wiring vive no app.js. -->
      <div class="examples">
        <button class="chip" data-fill="Um app de agendamento pra clínicas pequenas, com lembrete por WhatsApp.">App de agendamento</button>
        <button class="chip" data-fill="Um marketplace de aulas particulares conectando alunos e professores.">Marketplace de aulas</button>
        <button class="chip" data-fill="Uma automação que lê notas fiscais por e-mail e organiza numa planilha.">Automação de NF-e</button>
        <button class="chip" data-fill="Uma landing page pra captar leads de um curso online.">Landing de captação</button>
      </div>
      <div class="brief-actions">
        <button class="btn btn-primary" id="startBtn" data-copy="cta_start"></button>
      </div>
      <div class="error-banner" id="heroError"></div>
    </section>

    <!-- WIZARD (uma pergunta por tela) -->
    <section class="view" id="view-wizard">
      <div class="q-meta" id="qMeta"></div>
      <h2 class="q-title" id="qTitle"></h2>
      <p class="q-hint" id="qHint"></p>
      <div class="options" id="qOptions"></div>
      <!-- Detalhes concretos ficam FORA da lista rolável de opções, senão são
           cortados pelo overflow do container. -->
      <div class="details" id="qDetails"></div>
      <div class="wizard-nav">
        <button class="btn btn-ghost" id="backBtn" data-copy="back"></button>
        <button class="btn btn-primary" id="nextBtn" data-copy="next" disabled></button>
      </div>
    </section>

    <!-- REVIEW / gerar blueprint -->
    <section class="view" id="view-review">
      <div class="card">
        <div class="card-badge"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-11"></path></svg></span> Esqueleto extraído</div>
        <h2 data-copy="review_title"></h2>
        <p class="sub" data-copy="review_subhead"></p>
        <div class="summary" id="reviewSummary"></div>
        <button class="btn btn-primary btn-block" id="generateBtn" data-copy="generate_cta"></button>
        <div class="error-banner" id="reviewError"></div>
      </div>
    </section>

    <!-- PAYWALL -->
    <section class="view" id="view-paywall">
      <div class="card">
        <h2 data-copy="paywall_title"></h2>
        <div class="price-badge"><span class="cur">R$</span><span class="amt" id="priceAmt">20,00</span></div>
        <span class="mock-pill" id="mockPill" hidden>SANDBOX / MOCK</span>
        <p class="sub" data-copy="paywall_price_note"></p>
        <div class="pix-area">
          <!-- <img>, nao <canvas>: o QR vem do backend em base64 (/api/checkout). -->
          <div class="pix-qr"><img id="pixQr" src="" alt="QR Pix" /></div>
          <div class="pix-side">
            <p class="q-hint" data-copy="paywall_pix_hint"></p>
            <div class="copia-cola" id="copiaCola"></div>
            <button class="btn btn-ghost btn-block" id="copyBtn" data-copy="paywall_copy_btn"></button>
            <div class="waiting"><span class="dot"></span><span data-copy="paywall_waiting"></span></div>
          </div>
        </div>
        <div class="error-banner" id="payError"></div>
      </div>
    </section>

    <!-- DONE -->
    <section class="view" id="view-done">
      <div class="card">
        <div class="done-burst"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5 11-13"></path></svg></div>
        <h2 data-copy="done_title"></h2>
        <p class="sub" data-copy="done_subhead"></p>
        <div class="summary" id="doneSummary"></div>
        <div class="download-row">
          <a class="btn btn-primary" id="dlPrompt" download data-copy="download_prompt"></a>
          <button class="btn btn-ghost" id="copyPromptBtn" data-copy="copy_prompt"></button>
        </div>
        <div class="download-row">
          <a class="btn btn-ghost" id="dlMd" download data-copy="download_md"></a>
          <a class="btn btn-ghost" id="dlJson" download data-copy="download_json"></a>
        </div>
      </div>
    </section>

  </main>

  <footer class="app-footer"><span data-copy="footer"></span></footer>

  <script type="module" src="/assets/js/lightfall.js?v=9eb4081c"></script>
  <script src="/assets/js/copy.js?v=216223c9"></script>
  <script src="/assets/js/app.js?v=876581b9"></script>
</body>
</html>
